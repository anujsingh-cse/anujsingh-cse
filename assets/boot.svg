<svg xmlns="http://www.w3.org/2000/svg" width="700" height="290" viewBox="0 0 700 290" role="img" aria-label="skeptic-os boot sequence">
  <style>
    text { font: 13px ui-monospace, SFMono-Regular, Consolas, monospace; }
    .fg { fill: #24292f; }
    .dim { fill: #6e7781; }
    .ok { fill: #1a7f37; }
    .warn { fill: #9a6700; }
    @media (prefers-color-scheme: dark) {
      .fg { fill: #e6edf3; }
      .dim { fill: #7d8590; }
      .ok { fill: #3fb950; }
      .warn { fill: #d29922; }
    }
  </style>

  <!-- SMIL typing boot. no javascript, no external assets.
       unsupported renderers simply show nothing animates — the prose README
       below carries every fact. -->

  <text x="24" y="26" class="fg" opacity="0">guest@skeptic-os:~$ ./boot --verify-first
    <set attributeName="opacity" to="1" begin="0.2s" fill="freeze"/>
  </text>

  <text x="24" y="52" class="ok" opacity="0">[ ok ]<set attributeName="opacity" to="1" begin="0.6s" fill="freeze"/></text>
  <text x="86" y="52" class="fg" opacity="0">mounting /processes ........... 10 daemons resident
    <set attributeName="opacity" to="1" begin="0.6s" fill="freeze"/>
  </text>

  <text x="24" y="78" class="ok" opacity="0">[ ok ]<set attributeName="opacity" to="1" begin="1.0s" fill="freeze"/></text>
  <text x="86" y="78" class="fg" opacity="0">nvidia nim uplink ............. free tier
    <set attributeName="opacity" to="1" begin="1.0s" fill="freeze"/>
  </text>

  <text x="24" y="104" class="ok" opacity="0">[ ok ]<set attributeName="opacity" to="1" begin="1.4s" fill="freeze"/></text>
  <text x="86" y="104" class="fg" opacity="0">local models .................. ollama · one gtx 1650 (4 gb)
    <set attributeName="opacity" to="1" begin="1.4s" fill="freeze"/>
  </text>

  <text x="24" y="130" class="warn" opacity="0">[warn]<set attributeName="opacity" to="1" begin="1.8s" fill="freeze"/></text>
  <text x="86" y="130" class="fg" opacity="0">budget ........................ ₹0 — accepted as a constraint
    <set attributeName="opacity" to="1" begin="1.8s" fill="freeze"/>
  </text>

  <text x="24" y="156" class="ok" opacity="0">[ ok ]<set attributeName="opacity" to="1" begin="2.2s" fill="freeze"/></text>
  <text x="86" y="156" class="fg" opacity="0">trust daemon .................. running (trusted by no one)
    <set attributeName="opacity" to="1" begin="2.2s" fill="freeze"/>
  </text>

  <text x="24" y="182" class="ok" opacity="0">[ ok ]<set attributeName="opacity" to="1" begin="2.6s" fill="freeze"/></text>
  <text x="86" y="182" class="fg" opacity="0">containment ................... 1 enchanted object secured
    <set attributeName="opacity" to="1" begin="2.6s" fill="freeze"/>
  </text>

  <text x="24" y="214" class="fg" opacity="0">system ready. claims will require evidence.
    <set attributeName="opacity" to="1" begin="3.2s" fill="freeze"/>
  </text>

  <text x="24" y="244" class="dim" opacity="0">guest@skeptic-os:~$
    <set attributeName="opacity" to="1" begin="3.7s" fill="freeze"/>
  </text>
  <rect x="158" y="234" width="9" height="14" class="fg" opacity="0">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" begin="3.7s" repeatCount="indefinite"/>
  </rect>

  <text x="676" y="272" text-anchor="end" class="dim" opacity="0">a machine that checks machines · scroll to operate
    <set attributeName="opacity" to="1" begin="4.1s" fill="freeze"/>
  </text>
</svg>
