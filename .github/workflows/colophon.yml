name: colophon

on:
  schedule:
    - cron: "37 4 * * *" # daily, off-peak
  workflow_dispatch:

permissions:
  contents: write

jobs:
  advance-date:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Advance the colophon date stamp
        run: python tools/colophon.py

      - name: Commit if the date advanced
        run: |
          if git status --porcelain assets/ | grep -q .; then
            git config user.name "colophon[bot]"
            git config user.email "colophon@users.noreply.github.com"
            git add assets/revised.svg
            git commit -m "colophon: date advanced [skip ci]"
            git push
          else
            echo "no change"
          fi
