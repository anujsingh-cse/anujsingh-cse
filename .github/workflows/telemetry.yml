name: telemetry

on:
  schedule:
    - cron: "23 4 * * *" # daily, off-peak
  workflow_dispatch:
  push:
    paths:
      - "tools/telemetry.py"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate telemetry.svg from live API data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEMETRY_USER: ${{ github.repository_owner }}
        run: python tools/telemetry.py

      - name: Commit if reality changed
        run: |
          if git diff --quiet assets/telemetry.svg; then
            echo "no drift"; exit 0
          fi
          git config user.name "skeptic-telemetry[bot]"
          git config user.email "telemetry@users.noreply.github.com"
          git add assets/telemetry.svg
          git commit -m "telemetry: reality drifted [skip ci]"
          git push
